"A porta estava aberta. Clara estava na cama, os olhos abertos, fixos no teto.",
"— Mãe.",
"Clara não se mexeu.",
"— Mãe, eu preciso falar com você.",
"— Estou ouvindo. — A voz dela era calma. Distante.",
"Helena sentou-se na beira da cama.",
"— Você quase deixou o Miguel cair hoje.",
"— Foi um acidente.",
"— Não foi. — Helena sentiu a voz tremer. — Você não estava olhando. Você não viu.",
"— Eu estava distraída.",
"— Mãe, você tá sempre distraída. Você tá sempre em outro lugar. Você não tá aqui.",
"Clara virou a cabeça. Olhou para Helena. Havia algo nos olhos dela. Algo que não era raiva. Não era medo. Era… paz.",
"— Eu sei.",
"— Você sabe?",
"— Eu sei que não tô aqui. — Clara sorriu. — Eu sei que tô em outro lugar. Um lugar onde eu não preciso fingir. Onde eu não preciso sorrir. Onde eu posso ser triste.",
"— Mãe…",
"— Helena, eu tô cansada. — A voz dela era um sussurro. — Tão cansada. Eu passei a vida inteira fingindo. Fingindo que tava bem. Fingindo que o casamento era feliz. Fingindo que a maternidade era realizada. Fingindo que a vida valia a pena.",
"— Você não precisa fingir comigo.",
"— Preciso. — Clara tocou o rosto de Helena. A mão estava fria. — Você é minha filha. Você não merece carregar o meu peso.",
"— Eu quero carregar.",
"— Não quer. — Clara balançou a cabeça. — Você não sabe o que é. Você não sabe o que é acordar todo dia e sentir que não deveria estar aqui. Que você é um erro. Que o mundo seria melhor sem você.",
"Helena sentiu lágrimas nos olhos.",
"— Isso não é verdade.",
"— É verdade pra mim. — Clara fechou os olhos. — Sempre foi.",
"Helena não respondeu.",
"Ficou ali, sentada na beira da cama, ouvindo a respiração da mãe ficar mais lenta.",
"Até que Clara dormiu.",
"E Helena ficou acordada.",
"Olhando para a parede.",
"Que parecia pulsar."
]],

["Interlúdio — Os Nomes", [
"Depois da fotografia de Rosa, Helena começou a procurar nomes. Não na internet. Não havia internet em casa naquela época. Procurou em jornais velhos da biblioteca municipal. Procurou em recortes que Vera guardava. Procurou nas conversas dos vizinhos.",
"Encontrou pouco.",
"Rosa Almeida. Desaparecida em 1979.",
"Lídia Ferreira. Mudou-se em 1986.",
"Marta Siqueira. Internada por alguns meses e depois voltou para a cidade natal.",
"Cecília Ramos. Nunca encontrou o registro certo.",
"Os casos não eram iguais. Algumas mulheres simplesmente tinham ido embora. Algumas estavam vivas. Algumas tinham recebido tratamento. Algumas histórias não tinham nada de sobrenatural.",
"Isso era importante para Helena. Ela não queria transformar sofrimento real em lenda. O que assustava não era a ideia de que toda mulher triste virava fantasma. O que assustava era outra coisa: perceber quantas famílias tinham aprendido a chamar silêncio de normalidade.",
"A casa parecia aproveitar exatamente isso. Não criava a dor. Encontrava a dor que já estava ali e dava a ela uma porta.",
"A conversa entre Helena e Clara durou quase uma hora. Helena perguntou sobre a casa. Clara negou. Perguntou sobre a fotografia. Clara chorou. Perguntou sobre a menina. Clara ficou em silêncio.",
"— Mãe, quem é ela?",
"Clara respondeu tão baixo que Helena quase não ouviu.",
"— Minha irmã.",
"Helena congelou.",
"— Você tem outra irmã?",
"— Tinha.",
"Clara contou que, quando era criança, havia uma menina chamada Lídia. Vera era a mais velha. Clara, a do meio. Lídia, a mais nova. Um dia, Lídia desapareceu durante uma mudança. A família disse que ela tinha fugido. Nunca encontraram o corpo.",
"— E a casa?",
"Clara balançou a cabeça.",
"— Eu não quero falar.",
"— Ela estava em alguma casa?",
"— Helena.",
"— Mãe.",
"Clara segurou o braço dela.",
"— Se você continuar procurando, vai começar a ouvir.",
"— Ouvir o quê?",
"Clara olhou para a parede.",
"— Meu nome.",
"Naquela noite, Helena acordou com alguém sussurrando no corredor.",
"“Helena.”",
"Ela não respondeu.",
"O sussurro veio de novo.",
"“Helena.”",
"Depois, três batidas.",
"Toc. Toc. Toc.",
"Ela permaneceu deitada. O coração disparado.",
"Então ouviu uma voz infantil do outro lado da porta:",
"— Ela já sabe."
]],

["Interlúdio — O Que Vera Não Contou", [
"Vera esperou Helena dormir para tirar a fotografia do envelope. Sentou-se na cozinha e deixou a imagem sobre a mesa. Lídia. Clara. Ela mesma. Três meninas. Três expressões diferentes.",
"Ela lembrava daquele verão. Lembrava do cheiro da casa. Lembrava de Lídia dizendo que alguém morava dentro da parede. Lembrava da mãe mandando que ela calasse a boca.",
"Mas havia uma coisa que nunca contara a Clara.",
"Na noite em que Lídia desapareceu, Vera a viu entrar no corredor. Não estava sozinha. Uma mulher caminhava atrás dela. Vera era criança, mas reconheceu o vestido. Era o mesmo que aparecia na fotografia encontrada anos depois.",
"Vera correu para chamar a mãe. Quando voltou, Lídia tinha sumido. A mãe disse que ela fugira. Depois disse que ninguém deveria falar sobre aquilo.",
"Durante décadas, Vera tentou acreditar.",
"Até Clara começar a ouvir vozes.",
"Vera percebeu que a história estava voltando.",
"Foi por isso que, quando Helena ligou, ela decidiu contar uma parte. Não tudo. Ainda não. Tinha medo de que colocar todas as peças na mão de uma menina de dezesseis anos fosse apenas outra forma de condená-la.",
"Mas agora Helena estava dentro da casa.",
"Vera abriu uma gaveta e tirou um envelope antigo. Dentro havia uma carta de Lídia.",
"“Se eu não voltar, não procurem por mim. Ela gosta quando procuram. Ela faz a pessoa acreditar que ainda pode salvar quem já foi embora.”",
"Vera leu a frase várias vezes.",
"Depois queimou a carta.",
"Não porque quisesse esconder a verdade. Porque tinha medo de que a verdade também pudesse ser uma porta.",
"Na manhã seguinte, decidiu ir até Vila Nova dos Ipês. Não sabia se chegaria a tempo. Mas, pela primeira vez em décadas, Vera entendeu que guardar silêncio também era uma escolha. E talvez fosse justamente a escolha que aquela casa esperava das pessoas."
]],

["Capítulo 22 — A Fotografia", [
"Vera chegou numa tarde de chuva trazendo uma caixa.",
"— Eu deveria ter mostrado isso antes.",
"Dentro havia fotografias antigas. Uma delas mostrava a casa. A mesma fachada. A mesma janela do segundo andar. Só que a fotografia era de décadas atrás.",
"No verso havia uma data: 1978.",
"— Rosa — Vera disse. — Era o nome dela.",
"Helena segurou a fotografia.",
"— Você conheceu ela?",
"— Não pessoalmente. Minha mãe conheceu. Dizia que Rosa tinha uma filha pequena e que, depois de uma crise, sumiu. A família disse que ela tinha ido embora.",
"— E você acredita nisso?",
"Vera olhou para a casa pela janela.",
"— Não mais.",
"Ela contou que outras mulheres foram associadas àquela casa ao longo dos anos. Não havia documentos suficientes para provar uma história única. Havia apenas coincidências. Nomes. Desaparecimentos. Famílias que preferiam não falar.",
"Helena virou a fotografia. No canto, escrito a lápis, havia outra palavra: “Clara”.",
"Vera não tinha colocado aquilo ali.",
"As duas ficaram em silêncio.",
"A fotografia encontrada por Helena tinha outra cópia escondida atrás da moldura. Na segunda, Lídia aparecia inteira. Estava ao lado de Clara. No verso havia um endereço escrito à mão. Helena reconheceu o nome da rua: era a rua da casa onde estavam morando.",
"Ela correu até Vera.",
"A tia demorou para abrir a porta. Quando viu a fotografia, perdeu a expressão.",
"— Quem te deu isso?",
"— Encontrei.",
"Vera sentou-se.",
"— Sua mãe não deveria ter trazido isso de volta.",
"— Lídia morou naquela casa?",
"Vera demorou a responder.",
"— Por pouco tempo.",
"— O que aconteceu?",
"— Ela desapareceu.",
"— Como?",
"— Do jeito que algumas pessoas desaparecem quando todo mundo decide não fazer perguntas.",
"Helena sentiu raiva.",
"— Vocês sabiam?",
"— Éramos crianças.",
"Vera contou que a família alugou a casa por alguns meses. Lídia dizia ouvir uma mulher chamando seu nome. Depois começou a desenhar portas. Um dia, não estava mais no quarto. A porta do porão estava aberta.",
"— E sua mãe?",
"— Disse que Lídia tinha fugido.",
"Vera nunca acreditou.",
"Quando Helena saiu, Vera chamou:",
"— Não entre no porão.",
"— Por quê?",
"— Porque minha irmã voltou de lá diferente. E eu não quero perder outra pessoa."
]],

["Capítulo 23 — As Visões", [
"Clara começou a ver coisas.",
"No começo, eram vultos. Sombras nos cantos. Formas que desapareciam quando ela olhava diretamente.",
"Depois, os vultos ficaram mais nítidos. Mais definidos.",
"E, por fim, começaram a falar.",
"Helena não sabia o que a mãe ouvia. Mas via. Via Clara conversando com o vazio. Via Clara rindo de coisas que ninguém dizia. Via Clara chorando sem motivo.",
"— Mãe, com quem você tá falando?",
"— Ninguém.",
"— Mãe, eu tô vendo. Você tá falando com alguém.",
"— Não tô.",
"— Mãe…",
"— Helena. — A voz de Clara era fria. — Me deixa em paz.",
"Helena não deixou.",
"As visões de Clara ficaram mais frequentes. Ela via uma mulher sentada à mesa. Às vezes via Lídia. Às vezes via uma versão mais jovem de si mesma. O pior era quando via Helena.",
"— Ela estava no corredor — disse Clara.",
"— Quem?",
"— Você.",
"— Eu estava no meu quarto.",
"Clara chorou.",
"— Eu sei. Mas era você.",
"Helena começou a entender que a casa não mostrava simplesmente fantasmas. Ela mostrava possibilidades. Memórias. Medos. Coisas que poderiam acontecer.",
"Uma madrugada, Helena viu a mãe caminhando pelo corredor. Clara estava de olhos abertos, mas parecia dormir.",
"— Mãe?",
"Clara parou diante da porta do porão.",
"— Ainda não — murmurou.",
"— O que você está fazendo?",
"Clara virou-se. Por um segundo, seu rosto pareceu mais jovem.",
"— Ela está esperando.",
"— Quem?",
"Clara apontou para a porta.",
"— A casa.",
"Depois voltou para o quarto sem lembrar de nada.",
"Helena ficou diante da porta. Colocou a mão na maçaneta. A madeira estava quente. Do outro lado, alguém bateu três vezes.",
"Helena retirou a mão."
]],

["Capítulo 24 — Os Amigos de Miguel", [
"Miguel começou a desenhar casas.",
"No começo, Helena achou que era só uma fase. Depois percebeu que todos os desenhos eram iguais. Uma casa grande. Janelas pretas. Uma porta no fundo. E, quase sempre, quatro pessoas do lado de fora.",
"— Quem são? — ela perguntou.",
"— A gente.",
"— E por que a mãe está atrás?",
"Miguel olhou para o desenho.",
"— Ela não tá atrás.",
"— Então onde ela tá?",
"Ele apontou para uma das janelas.",
"— Ali.",
"Helena sentiu frio.",
"Naquela noite, Miguel falou dos amigos.",
"— Eles moram nas paredes.",
"Davi tentou rir.",
"— Amigos imaginários?",
"Miguel balançou a cabeça.",
"— Eles não são imaginários. Eles moravam aqui antes.",
"Clara deixou o garfo cair.",
"Ninguém perguntou por quê.",
"Miguel começou a conversar com os amigos que ninguém via. No começo, Helena tentou tratar como imaginação. Crianças inventavam amigos. Era normal. Mas Miguel sabia coisas que não tinha como saber.",
"— A mulher do vestido chama Rosa — disse um dia.",
"— Quem te contou?",
"— Ela.",
"— E Lídia?",
"Miguel ficou sério.",
"— Lídia não gosta de falar.",
"— Por quê?",
"— Porque ela ficou muito tempo esperando.",
"Helena sentiu um arrepio.",
"— Esperando o quê?",
"Miguel apontou para a parede.",
"— Alguém abrir.",
"Naquela tarde, Miguel desenhou um corredor cheio de portas. Em cada porta havia um nome. Rosa. Lídia. Marta. Cecília. Clara. Helena.",
"— Por que meu nome está aí?",
"Ele não respondeu.",
"Davi encontrou o desenho depois e ficou bravo.",
"— Chega dessas histórias.",
"Miguel chorou.",
"Helena defendeu o irmão.",
"— Ele não está inventando.",
"Davi olhou para ela.",
"— Você também está começando a acreditar.",
"— Eu estou começando a perceber.",
"Davi ficou em silêncio. Depois pegou o desenho e guardou numa gaveta. Não jogou fora. Essa foi a primeira vez que Helena percebeu que o pai também estava com medo."
]],

["Capítulo 25 — As Paredes", [
"As manchas de umidade começaram a crescer. Helena tentou limpá-las. No dia seguinte, voltaram.",
"Uma delas parecia uma mulher de perfil. Outra parecia uma criança.",
"Clara passou a mão pela parede.",
"— Ela tá com frio.",
"— Quem?",
"Clara percebeu o que tinha dito.",
"— Ninguém.",
"Davi decidiu chamar um pedreiro. O homem veio, examinou a parede e disse que havia infiltração.",
"Antes de ir embora, perguntou:",
"— Essa casa já teve problema de umidade?",
"Davi respondeu que não sabia.",
"O homem olhou para a parede mais uma vez.",
"— Tem coisa antiga aqui.",
"Naquela noite, Helena encontrou uma caixa escondida atrás do armário do corredor. Dentro havia fotografias, recibos e uma lista de nomes.",
"Rosa.",
"Lídia.",
"Marta.",
"Cecília.",
"Helena.",
"Ela ficou olhando para o último nome.",
"Ainda não estava escrito à tinta. Era apenas um risco de lápis.",
"As paredes começaram a mostrar manchas que pareciam rostos. Davi tentou pintar por cima. No dia seguinte, as manchas apareciam novamente. O pintor que ele chamou encontrou madeira antiga sob o reboco.",
"— Essa parede já foi aberta — disse o homem.",
"— Como sabe?",
"— Tem marca de batente.",
"Helena olhou. Havia mesmo uma moldura escondida dentro da parede.",
"Quando o homem foi embora, Helena e Miguel ficaram sozinhos no corredor. Miguel apontou para uma rachadura.",
"— Aqui.",
"Helena passou a unha. Uma pequena lasca caiu. Atrás havia papel. Ela puxou. Era uma lista de nomes escrita à mão.",
"Rosa. Lídia. Marta. Cecília.",
"E, abaixo, um espaço vazio.",
"Helena sentiu o estômago embrulhar.",
"— Não tem meu nome.",
"Miguel respondeu:",
"— Ainda não.",
"Ela guardou o papel. Naquela noite, ouviu o barulho de lápis riscando parede. Foi até o quarto de Miguel. Ele dormia. Sobre a mesa havia um desenho novo.",
"Uma mulher estava atrás de Helena.",
"No desenho, a mulher segurava sua mão."
]],

["Capítulo 26 — O Porão", [
"Davi havia trancado o porão desde a mudança.",
"Naquela noite, Helena encontrou a porta aberta.",
"Não desceu.",
"Fechou-a.",
"Quando voltou para o quarto, encontrou Miguel sentado na cama.",
"— Você abriu a porta?",
"— Não.",
"— Então quem abriu?",
"Miguel respondeu:",
"— Minha amiga.",
"A porta do porão abriu sozinha. Davi ouviu o estrondo e desceu primeiro. Encontrou uma escada estreita, coberta de poeira. Havia marcas no chão como se caixas tivessem sido arrastadas recentemente.",
"— Ninguém entra aqui — disse ele.",
"Helena apareceu atrás.",
"— Então quem abriu?",
"Davi não respondeu.",
"No fundo havia uma sala pequena. Um armário, uma mesa e dezenas de objetos antigos. Brinquedos, fotografias, roupas infantis, xícaras. Nada parecia pertencer à mesma família.",
"Helena encontrou uma colher de madeira igual à que sua mãe usava para fazer bolo.",
"— Isso não pode ser.",
"Davi pegou.",
"— Talvez seja parecida.",
"Na parede havia riscos de altura. Crianças haviam sido medidas ali durante décadas. Alguns nomes ainda eram legíveis.",
"Davi tocou um deles.",
"— Rosa.",
"Helena olhou para ele.",
"— Você conhece esse nome?",
"— Não.",
"Mas a voz dele dizia que conhecia.",
"No canto, Miguel apareceu.",
"— Eu disse para não entrar.",
"— Como você chegou aqui?",
"Ele apontou para uma porta menor.",
"— Ela abriu para mim.",
"Davi perguntou quem. Miguel não respondeu.",
"Quando subiram, a porta do porão fechou atrás deles. E, antes de a tranca cair, Helena ouviu uma mulher dizer seu nome."
]],

["Capítulo 27 — A Menina", [
"Helena voltou ao porão na madrugada.",
"O quarto no fundo não aparecia em nenhuma planta da casa. Era pequeno. Tinha uma cama infantil, uma escrivaninha e dezenas de marcas na parede.",
"Uma menina estava sentada na cama.",
"Helena parou.",
"O rosto da menina era o seu.",
"— Você demorou — ela disse.",
"— Quem é você?",
"— Depende de quem está perguntando.",
"— O que você quer?",
"— Que você pare de tentar salvar todo mundo.",
"Helena sentiu raiva.",
"— Minha mãe está aqui?",
"A menina olhou para a parede.",
"— Ainda não.",
"A palavra ficou no ar.",
"Ainda.",
"A menina apareceu no corredor no começo da noite. Helena pensou que fosse Miguel usando uma fantasia. Depois viu o rosto. Era o próprio rosto dela, mas mais jovem.",
"— Você demorou — disse a menina.",
"Helena não conseguiu se mexer.",
"— Quem é você?",
"— Você.",
"— Não.",
"A menina sorriu.",
"— Ainda não.",
"Helena perguntou por Clara.",
"A menina apontou para a porta do quarto.",
"— Sua mãe está aprendendo a descansar.",
"— Ela não quer isso.",
"— Quer.",
"— Você não sabe.",
"A menina inclinou a cabeça.",
"— Eu sei o que você vai querer quando cansar.",
"Helena sentiu a garganta fechar.",
"— O quê?",
"— Que alguém carregue você.",
"A menina desapareceu quando Helena piscou.",
"Depois disso, Helena passou a desconfiar de qualquer aparição que parecesse familiar. A casa não precisava assustá-la com monstros. Bastava usar aquilo que ela amava.",
"Na madrugada, encontrou Clara sentada na cozinha.",
"— Você falou com ela?",
"Clara olhou para Helena.",
"— Com quem?",
"— Com a menina.",
"Clara empalideceu.",
"— Não olha para ela.",
"— Por quê?",
"— Porque ela aprende com você."
]],

["Capítulo 28 — Rosa", [
"Helena encontrou o nome Rosa em um diário escondido no assoalho. A mulher havia morado naquela casa décadas antes. Tinha uma filha. O marido trabalhava longe. Ela escrevia sobre cansaço, culpa e a sensação de que a casa a observava.",
"A última página dizia apenas:",
"“Hoje ouvi minha filha me chamar do outro lado da parede.”",
"Helena fechou o diário.",
"Miguel apareceu atrás dela.",
"— Ela não morreu.",
"— Quem disse?",
"— Rosa.",
"— Você conhece ela?",
"Miguel apontou para a parede.",
"— Ela mora ali.",
"O diário de Rosa estava escondido dentro de uma caixa de farinha antiga. A primeira página dizia apenas: “Se alguém encontrar, não confie na casa.”",
"Rosa descrevia uma família que chegou à casa décadas antes. A mãe sofria em silêncio. A filha mais velha tentava cuidar dela. Um menino dizia conversar com pessoas nas paredes. Helena sentiu um nó no estômago ao ler. Era a mesma história.",
"Em outra página, Rosa escreveu que a casa não criava a dor. Ela encontrava a dor e a alimentava.",
"“Ela espera a pessoa cansar. Depois oferece descanso. Espera o filho sentir culpa. Oferece uma forma de consertar. Espera alguém ter medo de perder. Oferece a promessa de não perder.”",
"Helena fechou o diário.",
"A frase explicava tudo sem explicar nada.",
"No final havia uma anotação: “Se eu desaparecer, minha filha vai achar que foi culpa dela.”",
"Helena começou a chorar.",
"Ela entendeu que aquele era o verdadeiro ciclo. A casa precisava que alguém acreditasse que era responsável por salvar outra pessoa.",
"E Helena já estava começando a acreditar nisso."
]],

["Capítulo 29 — O Que a Casa Quer", [
"A casa não atacava todo mundo.",
"Helena percebeu isso quando Davi começou a dormir melhor, enquanto Clara piorava.",
"A casa oferecia coisas diferentes para cada pessoa.",
"Para Davi, oferecia esperança. Fazia Clara parecer bem por algumas horas.",
"Para Miguel, oferecia companhia.",
"Para Helena, oferecia pertencimento.",
"Para Clara, oferecia descanso.",
"Era isso que tornava tudo tão perigoso.",
"A casa não precisava obrigar ninguém a entrar.",
"Ela apenas oferecia exatamente aquilo que a pessoa mais queria.",
"Naquela noite, Clara disse:",
"— Eu acho que encontrei um lugar onde posso descansar.",
"Helena entendeu.",
"E teve medo.",
"A casa começou a oferecer coisas diferentes a cada um. Davi ouviu a voz do próprio pai dizendo que ele finalmente tinha feito tudo certo. Miguel encontrou uma sala cheia de brinquedos onde ninguém dizia que ele estava inventando coisas. Helena viu uma versão da família feliz, sem doença, sem medo.",
"Clara viu a cozinha antiga de Pouso Alegre. O bolo estava no forno. Helena era criança. Davi ria. Tudo parecia perfeito.",
"— Você pode ficar — disse uma voz.",
"Clara tocou a mesa.",
"— E meus filhos?",
"— Eles ficarão também.",
"Ela quase acreditou.",
"Do outro lado da casa, Helena percebeu que a visão da mãe estava ligada à dela. Se Clara ficasse, Helena poderia entrar naquela memória e permanecer ali.",
"Foi quando entendeu o preço. A casa não prometia apenas aquilo que as pessoas queriam. Ela oferecia uma vida sem a necessidade de enfrentar a vida real.",
"Helena procurou Davi.",
"— A gente precisa tirar a mãe daqui.",
"— Eu sei.",
"— E se ela não quiser sair?",
"Davi fechou os olhos.",
"— Então vamos lembrar a ela que amar alguém não significa obedecer ao que a pessoa quer quando ela está sofrendo.",
"Foi uma das primeiras decisões maduras que Davi tomou durante toda aquela história."
]],

["Interlúdio — Procurar", [
"Durante os primeiros dias depois do desaparecimento, Helena e Davi fizeram tudo o que podiam. Foram à delegacia. Procuraram hospitais. Perguntaram aos vizinhos. Refizeram o caminho entre a casa e a praça. Vera ficou com Miguel.",
"Davi não dormia.",
"Helena também não.",
"Em uma das noites, sentados no carro, Davi disse:",
"— Eu sempre achei que proteger vocês significava resolver as coisas.",
"— E agora?",
"— Agora eu sei que tem coisa que não se resolve sozinho.",
"Helena olhou para as mãos dele no volante.",
"— Eu também achei que precisava salvar a mãe.",
"Davi virou para ela.",
"— Você não precisava.",
"— Eu sei disso agora.",
"Era mentira. Ela ainda não sabia. Mas começava a entender.",
"No banco de trás, Miguel dormia abraçado ao desenho da casa. No papel, uma das janelas estava riscada com tanta força que quase rasgara a folha.",
"Abaixo, ele tinha escrito apenas uma palavra: “saída”."
]],

["Capítulo 30 — A Noite em que Clara Sumiu", [
"A febre de Miguel começou naquela tarde. Davi saiu para buscar remédio. Helena ficou com o irmão.",
"Clara desapareceu durante vinte minutos.",
"Quando Helena percebeu, encontrou a porta do porão aberta.",
"Desceu.",
"Clara estava diante da parede.",
"— Mãe.",
"Clara virou-se.",
"— Eu só quero dormir.",
"— Então dorme comigo.",
"— Eu tentei.",
"— A gente pode tentar de novo.",
"Clara chorou.",
"— Eu não consigo mais carregar isso.",
"Helena abraçou a mãe.",
"Por alguns segundos, Clara voltou a ser apenas Clara.",
"Depois, a parede bateu por dentro.",
"Toc.",
"Toc.",
"Toc.",
"Clara olhou para trás.",
"E desapareceu.",
"Não houve grito. Não houve sangue. Apenas silêncio.",
"Na noite em que Clara desapareceu, Helena acordou com o cheiro de bolo. O mesmo cheiro da cozinha de Pouso Alegre. Foi até a sala. Clara estava diante da porta do porão.",
"— Mãe.",
"Clara virou.",
"— Ela disse que eu posso descansar.",
"— Você pode descansar aqui. Com a gente.",
"— Não é o mesmo.",
"Helena segurou sua mão.",
"— Vem.",
"Por um momento, Clara pareceu voltar.",
"— Filha, eu sinto muito.",
"A parede atrás dela se abriu como uma porta. Não houve barulho. Apenas uma escuridão onde antes havia madeira.",
"Helena puxou Clara.",
"— Não!",
"Clara desapareceu.",
"Davi chegou segundos depois. Os dois procuraram. O quarto estava vazio. O corredor estava vazio. O porão estava aberto.",
"Miguel apareceu com o desenho de Rosa nas mãos.",
"— Ela levou a mamãe.",
"Helena respondeu:",
"— Não. Ela não levou. A mamãe entrou.",
"Essa diferença importava. Pela primeira vez, Helena não queria tratar Clara como alguém sem escolha. Clara estava doente, vulnerável e manipulada, mas continuava sendo uma pessoa.",
"Helena decidiu que iria buscá-la. Não porque fosse responsável por salvá-la, mas porque era sua mãe e ela ainda podia tentar alcançá-la."
]],

["Interlúdio — Davi", [
"Antes de Clara desaparecer, Davi tinha uma rotina que ninguém conhecia inteira. Ele acordava antes de todos, ficava alguns minutos sentado na beira da cama e só depois levantava. Não era oração. Não era planejamento. Era uma espécie de preparação para o dia. Ele precisava se convencer de que conseguiria atravessar mais uma manhã sem perceber o quanto estava perdido.",
"Na oficina, os colegas conheciam Davi como o homem que nunca reclamava. Ele consertava motores, carregava peças pesadas, resolvia problemas. Quando alguém dizia que uma máquina não tinha conserto, ele desmontava até encontrar alguma coisa que pudesse ser trocada. Essa habilidade foi útil durante anos. Também foi uma armadilha.",
"Com Clara, não havia peça quebrada. Não havia parafuso. Não havia manual.",
"Ele tentou comprar coisas. Uma televisão nova. Uma poltrona confortável. Flores. Um rádio. Tentou levá-la para jantar. Tentou fazer piadas. Tentou pedir que ela pensasse nos filhos. Depois percebeu que algumas dessas tentativas, embora feitas por amor, só faziam Clara sentir mais culpa.",
"Na noite em que ela desapareceu, Davi ficou sozinho na cozinha durante quase uma hora. Colocou as mãos sobre a mesa e chorou em silêncio. Helena encontrou o pai assim.",
"— Eu achei que conseguiria — ele disse.",
"— Conseguir o quê?",
"— Fazer ela ficar bem.",
"Helena sentou ao lado dele.",
"— Ninguém consegue fazer outra pessoa ficar bem sozinho.",
"Davi respirou fundo.",
"— Eu devia ter aprendido isso antes.",
"— Nós dois.",
"Ele olhou para ela.",
"— Não. Você tinha dezesseis anos.",
"Helena quis discutir. Mas não discutiu. Pela primeira vez, permitiu que o pai fosse apenas pai, e não alguém que precisava saber todas as respostas.",
"Foi naquela noite que Davi decidiu procurar ajuda. Não para apagar Clara. Não para esquecer a casa. Para aprender a continuar sem transformar a culpa numa segunda família dentro de casa."
]],

["Capítulo 31 — O Quarto Vazio", [
"Antes de desaparecer, Clara deixou o quarto arrumado. A cama feita. A roupa dobrada. O caderno guardado.",
"Helena ficou diante da porta por vários minutos. Aquilo parecia mais cruel do que encontrar tudo bagunçado. Era como se a mãe tivesse saído por alguns minutos e pudesse voltar a qualquer momento.",
"Davi entrou.",
"— Não mexe em nada.",
"— Por quê?",
"— Não sei.",
"Ele sentou na cama. Pegou uma das almofadas e apertou contra o rosto. Helena nunca tinha visto o pai chorar daquele jeito.",
"— Eu achei que ela estava melhor — ele disse.",
"— Ela não estava.",
"— Eu sei.",
"Helena sentou ao lado dele.",
"— A gente precisa procurar.",
"— Eu vou procurar.",
"— Não sozinho.",
"Davi olhou para ela.",
"— Não sozinho.",
"Naquela noite, pela primeira vez, eles procuraram juntos. Não apenas pela casa, mas pela cidade. E quanto mais perguntavam, mais percebiam que algumas pessoas conheciam aquela história antes deles.",
"O quarto vazio parecia maior sem Clara. O vestido dela continuava pendurado atrás da porta. A xícara estava na mesa. Um livro permanecia aberto na cama. Era como se a casa tivesse levado apenas a pessoa, deixando todo o resto para provocar culpa.",
"Davi sentou-se no chão.",
"— Eu devia ter percebido antes.",
"Helena sentou ao lado dele.",
"— Eu também.",
"— Você é filha. Não deveria ter que perceber.",
"— Mas eu percebi. E não consegui impedir.",
"Davi olhou para ela.",
"— Isso não é culpa sua.",
"— Então também não é sua.",
"Ele começou a chorar.",
"Foi a primeira vez que Helena viu o pai chorar sem esconder.",
"Miguel ficou na porta. Não entrou.",
"— Ela está chamando.",
"— Quem? — Davi perguntou.",
"— Mamãe.",
"Helena levantou.",
"— Onde?",
"Miguel apontou para o corredor.",
"— Não com os ouvidos."
]],

["Interlúdio — A Casa por Dentro", [
"Helena caminhou por um corredor que parecia não ter fim. As paredes mudavam de cor. Às vezes eram verdes, como a cozinha de Pouso Alegre. Depois ficavam azuis. Depois voltavam a ser madeira. Cada mudança vinha acompanhada de uma lembrança.",
"Ela viu Clara aos vinte anos. Depois Clara com Helena bebê. Depois Clara chorando sozinha. Depois Clara rindo de uma piada de Davi. A casa não inventava apenas sofrimento. Guardava também alegria. Era isso que a tornava perigosa.",
"Uma porta abriu. Helena viu a mãe preparando bolo.",
"— Mãe?",
"Clara não respondeu.",
"Era uma memória. Helena entrou mesmo assim. Sentiu o cheiro de baunilha. Viu a tigela sobre a mesa. Viu as mãos de Clara.",
"— Eu queria ficar aqui — Helena disse.",
"A Clara daquela lembrança sorriu.",
"— Então fica.",
"Helena fechou os olhos.",
"Por alguns segundos, foi tentador. Não havia doença. Não havia culpa. Não havia medo. Era uma manhã comum, congelada no tempo.",
"Mas Helena percebeu uma coisa: a lembrança não tinha Miguel. Nem Davi. Nem o futuro. Era perfeita porque não continuava.",
"— Isso não é minha mãe — disse.",
"A figura parou de mexer a massa.",
"— Não?",
"— Minha mãe não era só isso.",
"A cozinha escureceu.",
"— Ela também estava triste. Estava cansada. Tinha medo. Fez escolhas erradas. Amou a gente. E precisava de ajuda.",
"A imagem começou a rachar.",
"— Você quer uma mãe que nunca tenha sofrido — disse a casa.",
"— Não. Quero lembrar da minha mãe inteira.",
"A parede tremeu.",
"Helena continuou andando.",
"Foi assim que descobriu a única coisa que a casa não conseguia imitar: a verdade. A casa podia reproduzir vozes, rostos, cheiros e memórias. Mas não sabia o que fazer quando alguém recusava uma versão simples da própria história."
]],

["Capítulo 32 — O Vazio", [
"Davi não acreditou.",
"Procurou Clara pela casa, pela rua, pela cidade. Chamou a polícia. Falou com vizinhos. Vasculhou o quintal.",
"Helena sabia onde ela estava.",
"Mas não sabia como trazê-la de volta.",
"Miguel parou de desenhar.",
"Durante três dias, ninguém dormiu direito.",
"Na quarta noite, Davi sentou-se ao lado de Helena.",
"— Eu devia ter visto.",
"— Eu também.",
"— Não. Você é filha dela.",
"Helena olhou para ele.",
"— E você era marido dela.",
"Davi chorou.",
"Foi a primeira vez que Helena viu o pai chorar.",
"O vazio da casa parecia ter vontade própria. Helena começou a ouvir frases da mãe em lugares diferentes. Na cozinha, Clara dizia que estava cansada. No banheiro, dizia que queria dormir. No quarto, dizia que não queria decepcionar ninguém.",
"Helena percebeu que eram pedaços do caderno. A casa estava usando as palavras de Clara para construir uma versão dela.",
"Davi queria chamar alguém. Polícia. Médico. Qualquer pessoa. Helena sabia que não conseguiria explicar o que estava acontecendo sem parecer louca. Mesmo assim, insistiu em procurar ajuda na cidade.",
"O médico ouviu. Não acreditou na parte da casa, mas acreditou que Clara precisava ser encontrada e que a família precisava de apoio. Disse algo simples:",
"— Não deixem a culpa decidir o que vocês fazem agora.",
"Helena guardou a frase.",
"Naquela noite, decidiu que não entraria na casa por vingança. Entraria para encontrar Clara e sair.",
"Era uma diferença pequena. Mas era a diferença entre ser puxada pelo medo e escolher caminhar dentro dele."
]],

["Capítulo 33 — A Casa por Dentro", [
"Helena voltou ao porão.",
"Dessa vez, a menina estava esperando.",
"— Você quer sua mãe.",
"— Quero.",
"— Então precisa parar de procurar uma porta.",
"— O que eu procuro?",
"— A história.",
"A menina mostrou a parede.",
"As manchas formavam uma sequência. Mulheres. Filhas. Casas.",
"Não era uma família.",
"Era um ciclo.",
"A casa existia havia muito tempo. Não porque uma mulher tivesse virado um monstro, mas porque cada geração havia deixado ali uma dor que ninguém conseguia nomear. A casa acumulava aquilo.",
"Rosa não tinha criado a casa.",
"Ela tinha sido mais uma pessoa que entrou nela.",
"E Clara também.",
"Dentro da casa, Helena encontrou corredores que não existiam durante o dia. Cada porta levava a uma lembrança de outra família. Uma cozinha com uma mulher chamada Rosa. Um quarto com Lídia desenhando. Uma sala onde Marta esperava o marido voltar. A casa não mostrava mortes. Mostrava esperas.",
"Foi isso que mais assustou Helena.",
"Ela percebeu que o terror não estava em fantasmas correndo pelos corredores. Estava na repetição. Pessoas esperando alguém voltar. Filhos esperando a mãe melhorar. Mulheres esperando que alguém percebesse. Famílias esperando que o problema passasse sozinho.",
"No último corredor, encontrou Clara sentada à mesa.",
"— Mãe.",
"Clara levantou os olhos.",
"— Você veio.",
"— Vim.",
"— Não devia.",
"— Eu sei.",
"Helena sentou ao lado dela.",
"— Vamos embora.",
"Clara chorou.",
"— Eu não consigo.",
"— Então eu fico até você conseguir.",
"A casa começou a bater nas paredes. Três vezes. Depois seis. Depois dezenas.",
"Helena segurou a mão da mãe.",
"— Você não precisa sair inteira. Só precisa sair comigo."
]],

["Capítulo 34 — A Voz de Clara", [
"Helena ouviu a mãe atrás da parede.",
"— Filha.",
"Ela encostou a testa na madeira.",
"— Mãe?",
"— Não vem.",
"— Eu vou te tirar daí.",
"— Não desse jeito.",
"— Que jeito?",
"Silêncio.",
"— Você passou a vida tentando me salvar — Clara disse. — Não transforme isso na sua vida inteira.",
"Helena chorou.",
"— Eu sou sua filha.",
"— Eu sei. E é justamente por isso que quero que você vá embora.",
"A voz sumiu.",
"Helena percebeu então que a casa queria uma coisa muito simples: que ela acreditasse que amor significava carregar a dor de outra pessoa.",
"A voz de Clara veio de dentro da parede. Ela contou a Helena que a casa não queria seu corpo. Queria a culpa dela.",
"— Ela sabe que você faria qualquer coisa por mim.",
"— Eu faria.",
"— Esse é o problema.",
"Helena entendeu. Amar a mãe não significava entregar a própria vida à doença dela, nem transformar a própria existência numa vigília permanente.",
"— Você não precisa me salvar — Clara disse.",
"— Eu sei.",
"— Promete?",
"Helena hesitou.",
"— Prometo tentar.",
"A casa tremeu.",
"Não houve explosão. Não houve incêndio. Apenas uma porta se abriu atrás delas.",
"Clara olhou para a filha.",
"— Agora vai.",
"— Vem comigo.",
"— Eu estou tentando.",
"Helena percebeu que talvez aquela fosse a última coisa que sua mãe pudesse lhe dar: não uma solução, mas permissão para continuar vivendo."
]],

["Interlúdio — Ir Embora", [
"A decisão de sair de Vila Nova dos Ipês não foi dramática. Não houve incêndio. Não houve polícia. Não houve uma última aparição.",
"Davi alugou um caminhão pequeno. Vera ajudou com as caixas. Miguel guardou os desenhos. Helena separou os cadernos.",
"Na manhã da partida, ela ficou diante da casa por alguns minutos.",
"— Você quer dizer alguma coisa? — Vera perguntou.",
"— Não.",
"— Tem certeza?",
"Helena pensou.",
"— Acho que passei tempo demais tentando falar com ela.",
"Vera segurou seu ombro.",
"— Então agora escuta a sua própria voz.",
"Helena entrou no carro.",
"A casa ficou para trás.",
"Durante meses, ela esperou que algo acontecesse. Não aconteceu.",
"Foi justamente isso que ensinou a Helena uma coisa difícil: sobreviver nem sempre parece uma vitória. Às vezes parece só acordar no dia seguinte, fazer café e continuar. E isso precisa ser suficiente."
]],

["Capítulo 35 — A Decisão", [
"Helena decidiu entrar.",
"Não para morrer. Não para ficar.",
"Para encontrar Clara e sair.",
"Levou o caderno de Rosa. O desenho de Miguel. A fotografia de Vera. E a única coisa que ainda tinha da infância: uma colher de madeira da cozinha antiga.",
"A menina apareceu.",
"— Você vai deixar tudo isso para trás?",
"— Não.",
"— Então por que entrar?",
"— Porque não preciso esquecer para ir embora.",
"A menina sorriu.",
"Pela primeira vez, parecia triste.",
"— Talvez você seja mesmo diferente.",
"Helena colocou a mão na parede.",
"E entrou.",
"A decisão de Helena foi atravessar o corredor carregando quatro coisas: o caderno de Rosa, o desenho de Miguel, a fotografia de Vera e a velha colher de madeira que encontrara no porão. Não sabia por que escolhera aqueles objetos. Talvez porque cada um representasse uma parte da história. Memória. Família. Verdade. Casa.",
"Quando chegou à porta, a casa tentou mostrar a infância de Helena. Clara jovem. Davi sorrindo. Miguel pequeno. Uma cozinha perfeita.",
"— Fica — disse a casa.",
"Helena fechou os olhos.",
"— Não.",
"— Você pode ter tudo de volta.",
"— Eu não quero de volta. Quero seguir.",
"A visão desapareceu.",
"Helena encontrou Clara no último cômodo. A mãe parecia cansada, mas consciente.",
"— Vamos.",
"Clara levantou.",
"Quando chegaram à porta, Clara parou.",
"— Você não precisa morar comigo para me amar.",
"Helena chorou.",
"— Eu sei.",
"— Agora sabe.",
"A porta se abriu. A luz da manhã entrou.",
"Helena saiu.",
"Quando olhou para trás, Clara não estava mais ali."
]],

["Capítulo 36 — O Que Fica", [
"Do outro lado não havia monstros.",
"Havia cozinhas.",
"Centenas delas. Mesas, panelas, brinquedos, toalhas, fotografias. Pequenos pedaços de vidas interrompidas.",
"Helena viu Rosa. Depois Lídia. Depois Marta.",
"E encontrou Clara sentada à mesa de uma cozinha antiga.",
"— Mãe.",
"Clara levantou.",
"— Você veio.",
"— Vim buscar você.",
"— Não pode me carregar.",
"— Então vem andando.",
"Clara sorriu.",
"— Eu tenho medo.",
"— Eu também.",
"Elas deram as mãos.",
"A casa começou a ruir ao redor delas. Não como uma explosão. Como uma lembrança perdendo força. As paredes ficaram transparentes. As vozes se afastaram.",
"Helena não destruiu a dor das mulheres.",
"Ela fez outra coisa.",
"Deixou que elas fossem embora sem precisar negar que tinham sofrido.",
"Clara soltou a mão dela.",
"— Vai, Helena.",
"— Mãe…",
"— Você não precisa morar comigo para me amar.",
"Helena chorou.",
"Clara desapareceu.",
"Quando Helena abriu os olhos, estava no chão do porão. Miguel estava ao seu lado.",
"— Você voltou — ele disse.",
"Helena abraçou o irmão.",
"A casa continuava de pé.",
"Mas estava vazia."
]],

["Parte V — O Que Fica", [
"O que ficou não foi uma resposta. Foi silêncio. Helena queria uma explicação clara para tudo. Não teve. A casa continuou de pé. As paredes não desabaram. Não havia prova de que alguma coisa sobrenatural tinha acontecido. Apenas pessoas que tinham saído diferentes.",
"Davi procurou ajuda. Miguel voltou a desenhar, mas agora desenhava árvores, carros e pessoas. Helena começou a falar mais.",
"Às vezes, ainda ouvia três batidas. Nunca respondia.",
"Ela aprendeu que não precisava desafiar a casa. Bastava não entregar a ela o que queria.",
"A família deixou Vila Nova dos Ipês algumas semanas depois. Antes de ir, Helena ficou diante da casa.",
"— Adeus — disse.",
"Não houve resposta.",
"Ela quase se sentiu decepcionada. Depois percebeu que silêncio também podia ser liberdade."
]],

["Capítulo 37 — O Dia Seguinte", [
"O dia seguinte não pareceu um recomeço. Pareceu apenas outro dia. O café foi feito. Miguel foi para a escola. Davi saiu para trabalhar. Helena foi à padaria.",
"Mas havia pequenas diferenças. Ninguém ouviu passos no corredor. Nenhuma porta abriu sozinha. O relógio continuava funcionando.",
"Naquela noite, Miguel fez um desenho. Pela primeira vez em meses, não desenhou a casa. Desenhou os quatro sentados na cozinha antiga de Pouso Alegre. Clara estava no desenho, sorrindo.",
"— Você acha que ela está aí? — ele perguntou.",
"Helena olhou para a folha.",
"— Acho que ela está onde as lembranças conseguem chegar.",
"Miguel pareceu satisfeito.",
"— Então ela não está sozinha.",
"Helena abraçou o irmão.",
"— Não.",
"E, naquela noite, ela finalmente conseguiu dormir sem deixar a porta aberta.",
"No dia seguinte, Miguel fez um desenho diferente. Não havia casa. Havia quatro pessoas sentadas num banco de praça. Uma delas era Clara.",
"— Ela está feliz? — Helena perguntou.",
"— Não sei.",
"— Então por que desenhou?",
"— Porque eu lembro dela.",
"Helena sorriu.",
"Durante muito tempo, ela acreditou que lembrar era voltar. Descobriu que não era. Lembrar podia ser apenas reconhecer que algo aconteceu e continuar.",
"Davi começou a cozinhar. Queimava arroz, exagerava no sal, mas insistia. Uma noite fez bolo de fubá. Ficou torto. Miguel comeu dois pedaços. Helena riu.",
"— Mamãe faria melhor.",
"— Com certeza — Davi respondeu.",
"Ninguém ficou triste por ouvir o nome dela. Essa foi a primeira vitória pequena. Clara podia ser lembrada sem que a casa inteira parasse."
]],

["Capítulo 38 — Depois", [
"Davi nunca conseguiu aceitar completamente o desaparecimento de Clara. Mas, pela primeira vez, começou a procurar ajuda para si mesmo e para Miguel. Helena também.",
"Eles deixaram Vila Nova dos Ipês.",
"Não queimaram a casa. Não precisaram.",
"Algumas coisas não precisam ser destruídas para deixarem de mandar na nossa vida.",
"Miguel guardou os desenhos por anos. Helena guardou o caderno de Rosa. Davi guardou a aliança de Clara numa caixa.",
"Cada um carregou uma parte."
]],

["Interlúdio — Antes do Fim", [
"Helena passou os últimos anos da vida aprendendo a lembrar sem voltar.",
"Guardou a fotografia de Vera numa caixa. Guardou a colher de madeira na cozinha. Guardou um dos desenhos de Miguel entre as páginas do próprio livro.",
"Não guardou nada da casa.",
"Certa tarde, já idosa, recebeu uma ligação de Miguel. Conversaram sobre coisas simples. Trabalho. Filhos. O preço do café.",
"Antes de desligar, ele perguntou:",
"— Você ainda sonha com ela?",
"Helena sorriu.",
"— Às vezes.",
"— E tem medo?",
"— Não mais.",
"Depois da ligação, ela foi até a cozinha. Fez bolo de fubá. Não porque precisava lembrar da mãe, mas porque gostava do cheiro.",
"Quando o bolo ficou pronto, a casa estava cheia de vozes. A filha falava com os netos na sala. Alguém ria no corredor.",
"Helena percebeu que tinha passado a vida tentando escapar de uma casa.",
"E só no fim entendeu que a casa que importava sempre tinha sido aquela: a que ela conseguiu construir de outro jeito.",
"Depois, a vida não ficou perfeita. Davi ainda teve dias ruins. Miguel ainda acordava assustado. Helena ainda sentia culpa às vezes. Mas agora eles falavam.",
"Davi aprendeu a perguntar antes de tentar resolver. Miguel aprendeu que amigos imaginários não precisavam ser segredos. Helena aprendeu que podia amar alguém e ainda assim ter limites.",
"A colher de madeira ficou com Helena. Ela a usava para fazer bolo. Não porque pertencesse à casa, mas porque decidiu que um objeto não teria poder sobre sua vida.",
"Anos depois, quando alguém perguntou se ela acreditava em casas assombradas, Helena respondeu:",
"— Algumas casas não precisam de fantasmas.",
"A pessoa riu, achando que era brincadeira. Helena não explicou.",
"Havia coisas que só faziam sentido para quem tinha vivido."
]],

["Interlúdio — Clara Antes da Casa", [
"Clara tinha vinte anos quando conheceu Davi. Gostava de cantar enquanto arrumava a casa. Gostava de bolo de fubá. Gostava de caminhar sem destino. Tinha medo de hospitais e de ficar sozinha em lugares desconhecidos. Queria ter filhos. Queria uma casa com uma cozinha grande. Queria envelhecer com alguém.",
"Helena encontrou essas coisas anos depois, quando Vera entregou uma caixa antiga. Havia cartas, fotografias, uma fita cassete e um caderno pequeno.",
"Na primeira página, Clara tinha escrito: “Eu quero uma vida normal.”",
"Helena leu a frase várias vezes.",
"Não havia nada de extraordinário naquele desejo. Era justamente por isso que doía. Clara não tinha começado a história como alguém destinada à tragédia. Era uma pessoa comum que amava, errava, sonhava e, em algum momento, ficou doente.",
"O caderno mostrava uma coisa que Helena nunca tinha visto: Clara também tinha medo de repetir a própria mãe.",
"“Às vezes acho que minha mãe não sabia me amar sem medo. Tenho medo de fazer o mesmo com Helena.”",
"Outra página dizia: “Se um dia eu ficar triste demais, quero que minha filha saiba que não é responsabilidade dela me salvar.”",
"Helena fechou o caderno e chorou. A frase parecia uma resposta enviada através de décadas.",
"A casa tinha tentado transformar Clara numa mulher sem saída. A memória devolvia outra pessoa: alguém que queria sair, que tentou, que teve recaídas, que pediu ajuda tarde demais e que também amou a filha o bastante para desejar que ela não carregasse seu sofrimento.",
"Helena percebeu que a mãe não podia ser reduzida à última noite. Nem à doença. Nem ao desaparecimento.",
"Talvez fosse isso que a casa mais temesse. Uma pessoa lembrada por inteiro era muito mais difícil de aprisionar."
]],

["Capítulo 39 — Dez Anos", [
"Dez anos depois, Helena voltou à cidade.",
"Miguel foi com ela. Adulto, quieto e muito menos assustado do que antes.",
"A casa ainda estava lá.",
"A porta continuava destrancada.",
"Helena não entrou.",
"Ficou diante dela por alguns minutos.",
"— Você quer entrar? — Miguel perguntou.",
"— Não.",
"Ele sorriu.",
"— Então por que veio?",
"Helena olhou para a janela do andar de cima.",
"— Para descobrir se eu ainda precisava entrar.",
"Não precisava.",
"Foram embora.",
"Dez anos depois, Helena voltou à cidade. A rua estava menor. A praça parecia diferente. A casa, não.",
"Miguel foi com ela. Caminharam até o portão.",
"— Você quer entrar?",
"— Não.",
"— Tem certeza?",
"— Tenho.",
"Helena percebeu que havia passado dez anos imaginando aquela visita como um confronto. Não era. Era apenas uma mulher adulta diante de uma construção velha.",
"— Eu achei que teria medo.",
"Miguel sorriu.",
"— Talvez você só tivesse medo de precisar voltar.",
"Ela olhou para o irmão.",
"— Você cresceu.",
"— Você também.",
"Eles foram embora sem entrar. Pela primeira vez, a casa não parecia uma porta. Parecia apenas uma casa."
]],

["Interlúdio — Os Anos Entre", [
"Os anos seguintes não foram uma linha reta. Helena terminou a escola. Trabalhou. Estudou. Teve dias em que acordou acreditando que tinha ouvido as três batidas. Teve outros em que esqueceu completamente da casa.",
"Miguel cresceu mais rápido do que ela imaginava. Parou de desenhar paredes. Começou a desenhar pessoas. Depois carros. Depois prédios. Quando adulto, virou o tipo de pessoa que sempre verificava se uma porta estava trancada duas vezes.",
"Davi demorou mais. Algumas culpas não desaparecem porque alguém explica que elas não são suas. Ele precisou aprender isso aos poucos. Começou terapia, voltou a trabalhar em horários menores e passou a cozinhar aos domingos. Não era uma transformação perfeita. Era apenas uma sequência de pequenas escolhas diferentes.",
"Vera envelheceu. Antes de morrer, entregou a Helena a fotografia de Lídia.",
"— Você não precisa guardar — disse.",
"Helena respondeu:",
"— Quero guardar.",
"— Por quê?",
"— Porque ela existiu.",
"Foi importante para Helena entender que lembrar não significava permanecer presa. Algumas memórias mereciam um lugar justamente para não precisarem ficar escondidas.",
"Anos depois, Helena encontrou a filha brincando no quintal. A menina tinha o nome de Clara e gostava de fazer bolos ruins. Uma tarde, derrubou farinha no chão e começou a chorar.",
"Helena quase disse que não era nada.",
"Mas ajoelhou.",
"— Você está triste.",
"— Estou.",
"— Então vamos limpar juntas.",
"Foi uma coisa pequena. Quase ridícula. Mas Helena ficou olhando para a filha e percebeu que era assim que um ciclo terminava: não com uma grande vitória, mas com uma resposta diferente numa terça-feira qualquer."
]],

["Capítulo 40 — O Livro", [
"Helena começou a escrever.",
"No começo, tentou contar a história da casa. Depois percebeu que não era isso que queria contar.",
"Escreveu sobre a mãe. Sobre o silêncio. Sobre pessoas que amam alguém e não sabem como ajudar. Sobre filhos que confundem amor com responsabilidade. Sobre famílias que demoram a perceber que pedir ajuda não é fracasso.",
"Chamou o livro de A Casa que Nos Habita.",
"Não porque a casa ainda existisse.",
"Mas porque algumas coisas continuam morando dentro da gente mesmo depois que vamos embora.",
"Quando Helena começou o livro, tentou escrever tudo exatamente como aconteceu. Descobriu que não conseguia. Algumas lembranças eram precisas demais. Outras pareciam sonhos. Então decidiu não escrever para provar nada. Escreveu para dizer o que aprendera.",

<script>
/* ============================================================
   MOTOR DO LIVRO
   - Paginação por palavras (~130 palavras por página)
   - Flip 3D ao avançar / retroceder
   - Sumário clicável gerado automaticamente
   - Clique nas laterais, teclado, swipe
   - Capa com banner SVG
   ============================================================ */
(function(){
  const WORDS_PER_PAGE = 130;

  const bookEl    = document.getElementById('book');
  const prevBtn   = document.getElementById('prevBtn');
  const nextBtn   = document.getElementById('nextBtn');
  const counterEl = document.getElementById('counter');
  const barEl     = document.getElementById('progressBar');
  const tocBtn    = document.getElementById('tocBtn');
  const tocBack   = document.getElementById('tocBack');
  const zoneLeft  = document.getElementById('zoneLeft');
  const zoneRight = document.getElementById('zoneRight');
  const hintEl    = document.getElementById('hint');

  /* -------------------- Utilidades -------------------- */
  const countWords = s => (s.match(/[A-Za-zÀ-ÿ0-9'’-]+/g) || []).length;
  const escapeHtml = s => s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Converte um "parágrafo" em HTML aplicando marcações simples.
  // Se começar com "—" ou "–" é diálogo; se for curto e sem letras é batida.
  function paraToHtml(text){
    const t = text.trim();
    const isDialogue = /^[—–-]\s/.test(t);
    const isBeat     = /^(Toc\.?\s*){2,}/i.test(t) && t.length < 40;
    const isCenter   = /^FIM\.?$/i.test(t) ||
                       /^By DEv/i.test(t);

    let html = escapeHtml(t)
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/“([^”]*)”/g,'&ldquo;$1&rdquo;')
      .replace(/"([^"]*)"/g,'&ldquo;$1&rdquo;');

    if (isBeat)      return `<p class="batida">${html}</p>`;
    if (isCenter)    return `<p class="center">${html}</p>`;
    if (isDialogue)  return `<p class="dialogue">${html}</p>`;
    return `<p>${html}</p>`;
  }

  /* -------------------- Paginação -------------------- */
  // Produz uma lista de páginas: cada uma com { title, html, isCover, isToc }
  function buildPages(){
    const pages = [];
    // Capa
    pages.push({ cover:true });
    // Sumário (preenchido depois)
    const tocPageIndex = pages.length;
    pages.push({ toc:true });

    // Capítulos — cada seção é uma "âncora" para o TOC
    const tocEntries = [];

    STORY.forEach(([title, paragraphs], secIdx) => {
      const sectionPages = [];
      let bucket = [];
      let words  = 0;
      let firstOfSection = true;

      const pushPage = () => {
        const isCont = !firstOfSection;
        const displayTitle = isCont ? title + ' — (continuação)' : title;
        const html = bucket.map(paraToHtml).join('');
        // Primeira página da seção recebe capitular
        let finalHtml = html;
        if (firstOfSection){
          finalHtml = finalHtml.replace(/<p([^>]*)>/, (m,attr) => `<p${attr} class="lead">`);
        }
        const pageIndex = pages.length;
        pages.push({
          title: displayTitle,
          sectionTitle: title,
          html: finalHtml,
          isFirstOfSection: firstOfSection
        });
        sectionPages.push(pageIndex);
        bucket = [];
        words  = 0;
        firstOfSection = false;
      };

      paragraphs.forEach(par => {
        const w = Math.max(1, countWords(par));
        if (bucket.length && words + w > WORDS_PER_PAGE){
          pushPage();
        }
        bucket.push(par);
        words += w;
      });
      if (bucket.length) pushPage();

      tocEntries.push({
        title,
        firstPage: sectionPages[0]
      });
    });

    return { pages, tocEntries, tocPageIndex };
  }

  const { pages, tocEntries, tocPageIndex } = buildPages();

  /* -------------------- Render de uma página -------------------- */
  function renderPageContent(p){
    if (p.cover) return renderCover();
    if (p.toc)   return renderToc();
    return renderTextPage(p);
  }

  function renderCover(){
    return `
      <div class="cover">
        <div class="cover-bg"></div>
        <div class="cover-overlay"></div>
        <div class="cover-frame">
          <p class="kicker">Romance</p>
          <h1>A Casa<span class="amp">que nos habita</span></h1>
          <div class="rule"></div>
          <p class="subtitle">Edição Expandida</p>
          <p class="byline">By DEv @dev_esieme</p>
        </div>
      </div>`;
  }

  function renderToc(){
    const items = tocEntries.map((e, i) => `
      <li>
        <button type="button" data-goto="${e.firstPage}">
          <span class="t-num">${String(i+1).padStart(2,'0')}</span>
          <span class="t-name${e.firstPage === tocPageIndex ? ' cover-entry' : ''}">${escapeHtml(e.title)}</span>
          <span class="t-dots"></span>
          <span class="t-num">${String(e.firstPage+1).padStart(3,'0')}</span>
        </button>
      </li>`).join('');
    return `
      <div class="page-inner toc-inner">
        <p class="toc-title">Sumário</p>
        <ul class="toc-list">
          <li>
            <button type="button" data-goto="0">
              <span class="t-num">—</span>
              <span class="t-name cover-entry">Capa</span>
              <span class="t-dots"></span>
              <span class="t-num">001</span>
            </button>
          </li>
          ${items}
        </ul>
      </div>`;
  }

  function renderTextPage(p){
    const pNum = '— ' + (pages.indexOf(p) + 1);
    return `
      <div class="page-inner">
        <div class="page-header">
          <span class="h-left">${escapeHtml(p.title || '')}</span>
          <span class="h-right">A Casa que Nos Habita</span>
        </div>
        <div class="page-body">${p.html}</div>
        <div class="page-footer">
          <span>Edição Expandida</span>
          <span>${pNum}</span>
        </div>
      </div>`;
  }

  /* -------------------- Estado / controle -------------------- */
  let current = 0;
  let animating = false;
  let frontEl, backEl;

  function createPageEl(){
    const el = document.createElement('div');
    el.className = 'page';
    el.style.transform = 'rotateY(0deg)';
    return el;
  }

  function setup(){
    bookEl.innerHTML = '';
    frontEl = createPageEl();
    backEl  = createPageEl();
    backEl.style.zIndex = 1;
    frontEl.style.zIndex = 2;
    bookEl.appendChild(backEl);
    bookEl.appendChild(frontEl);
    loadPage(frontEl, current);
    loadPage(backEl, current + 1);
    updateChrome();
  }

  function loadPage(el, i){
    if (i < 0 || i >= pages.length){
      el.innerHTML = '';
      el.dataset.idx = -1;
      return;
    }
    el.innerHTML = renderPageContent(pages[i]);
    el.dataset.idx = i;
  }

  function updateChrome(){
    counterEl.textContent = (current + 1) + ' / ' + pages.length;
    barEl.style.width = ((current + 1) / pages.length * 100) + '%';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    document.body.classList.toggle('in-toc', !!(pages[current] && pages[current].toc));
  }

  function getFlipDuration(){
    // Respeita prefers-reduced-motion
    const prefersReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    return prefersReduce ? 250 : 800;
  }

  function flipForward(){
    if (animating) return;
    if (current >= pages.length - 1) return;
    animating = true;

    // backEl já tem a próxima página carregada
    const D = getFlipDuration();
    frontEl.classList.add('flipping');
    // força reflow antes da animação
    void frontEl.offsetWidth;
    frontEl.style.transform = 'rotateY(-180deg)';

    setTimeout(() => {
      // Swap
      current++;
      // O antigo front vira o novo back (reset + carrega a página +2)
      const exFront = frontEl;
      const exBack  = backEl;

      exFront.style.transition = 'none';
      exFront.style.transform = 'rotateY(0deg)';
      exFront.style.zIndex = 1;
      exFront.classList.remove('flipping');
      loadPage(exFront, current + 1);

      exBack.style.zIndex = 2;

      // força reflow
      void exFront.offsetWidth;
      exFront.style.transition = '';

      frontEl = exBack;
      backEl  = exFront;

      animating = false;
      updateChrome();
    }, D);
  }

  function flipBackward(){
    if (animating) return;
    if (current <= 0) return;
    animating = true;

    const D = getFlipDuration();

    // backEl passará a ser a página anterior
    loadPage(backEl, current - 1);
    backEl.style.transition = 'none';
    backEl.style.transform = 'rotateY(-180deg)';
    backEl.style.zIndex = 3;
    void backEl.offsetWidth;

    backEl.classList.add('flipping');
    backEl.style.transition = '';
    void backEl.offsetWidth;
    backEl.style.transform = 'rotateY(0deg)';

    setTimeout(() => {
      current--;
      // backEl agora está em cima e visível
      const exFront = frontEl;
      const exBack  = backEl;

      exBack.classList.remove('flipping');
      exBack.style.zIndex = 2;

      exFront.style.zIndex = 1;
      exFront.style.transform = 'rotateY(0deg)';
      loadPage(exFront, current + 1);

      frontEl = exBack;
      backEl  = exFront;

      animating = false;
      updateChrome();
    }, D);
  }

  function goto(i, instant){
    i = Math.max(0, Math.min(pages.length - 1, i));
    if (i === current) return;
    if (instant){
      current = i;
      loadPage(frontEl, current);
      loadPage(backEl, current + 1);
      updateChrome();
      return;
    }
    // Animação em cadeia até chegar no alvo
    if (i > current){
      const step = () => {
        if (current === i || animating) return;
        flipForward();
        setTimeout(step, getFlipDuration() + 30);
      };
      step();
    } else {
      const step = () => {
        if (current === i || animating) return;
        flipBackward();
        setTimeout(step, getFlipDuration() + 30);
      };
      step();
    }
  }

  /* -------------------- Eventos -------------------- */
  prevBtn.addEventListener('click', e => { e.stopPropagation(); flipBackward(); });
  nextBtn.addEventListener('click', e => { e.stopPropagation(); flipForward(); });
  tocBtn.addEventListener('click', e => {
    e.stopPropagation();
    goto(tocPageIndex, true);
  });
  tocBack.addEventListener('click', e => {
    e.stopPropagation();
    // volta pra página que estava antes do sumário
    goto(current === tocPageIndex ? 0 : current, true);
  });

  zoneLeft.addEventListener('click', () => flipBackward());
  zoneRight.addEventListener('click', () => flipForward());

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); flipForward(); }
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')  { e.preventDefault(); flipBackward(); }
    if (e.key === 'Home'){ e.preventDefault(); goto(0, true); }
    if (e.key === 'End'){ e.preventDefault(); goto(pages.length-1, true); }
  });

  // Delegação para cliques no TOC
  bookEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-goto]');
    if (!btn) return;
    const i = parseInt(btn.dataset.goto, 10);
    if (Number.isFinite(i)) goto(i, true);
  });

  // Swipe
  let sX = null, sY = null;
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sX = e.touches[0].clientX;
    sY = e.touches[0].clientY;
  }, { passive:true });
  document.addEventListener('touchend', e => {
    if (sX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - sX;
    const dy = t.clientY - sY;
    sX = sY = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if (dx < 0) flipForward(); else flipBackward();
    }
  }, { passive:true });

  // Hint
  setTimeout(() => {
    document.body.classList.add('show-hint');
    setTimeout(() => document.body.classList.remove('show-hint'), 3200);
  }, 900);

  /* -------------------- Start -------------------- */
  setup();
})();
</script>
